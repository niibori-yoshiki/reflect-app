<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 8px; background: transparent; }
    .container { display: flex; flex-direction: column; gap: 8px; }
    .controls { display: flex; align-items: center; gap: 12px; }
    .mic-btn {
        width: 52px; height: 52px; border-radius: 50%;
        border: 3px solid #1a237e; background: white; cursor: pointer;
        font-size: 24px; display: flex; align-items: center; justify-content: center;
        transition: all 0.3s; outline: none;
    }
    .mic-btn:hover { background: #e8eaf6; }
    .mic-btn.active {
        background: #ef5350; border-color: #ef5350;
        animation: pulse 1.5s ease-in-out infinite;
    }
    .mic-btn.active:hover { background: #e53935; }
    .status { font-size: 14px; color: #666; flex: 1; }
    .transcript {
        padding: 10px 14px; background: #f5f5f5; border-radius: 8px;
        font-size: 15px; color: #333; min-height: 40px;
        line-height: 1.5; border: 1px solid #e0e0e0;
        white-space: pre-wrap; word-break: break-word;
    }
    .transcript.empty { display: none; }
    .bottom-row { display: flex; justify-content: flex-end; gap: 8px; }
    .send-btn {
        padding: 8px 20px; background: #1a237e; color: white;
        border: none; border-radius: 8px; cursor: pointer;
        font-size: 14px; font-weight: bold; transition: background 0.2s;
    }
    .send-btn:hover { background: #283593; }
    .lang-toggle {
        padding: 8px 14px; background: #e8eaf6; color: #1a237e;
        border: 1px solid #1a237e; border-radius: 8px; cursor: pointer;
        font-size: 13px; transition: all 0.2s;
    }
    .lang-toggle:hover { background: #c5cae9; }
    @keyframes pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(239, 83, 80, 0.4); }
        50% { box-shadow: 0 0 0 12px rgba(239, 83, 80, 0); }
    }
    .unsupported { color: #f44336; font-size: 14px; padding: 12px; }
</style>
</head>
<body>
<div class="container" id="app">
    <div class="controls">
        <button class="mic-btn" id="micBtn" onclick="toggle()">🎤</button>
        <span class="status" id="status">マイクボタンを押して話してください</span>
    </div>
    <div class="transcript empty" id="transcript"></div>
    <div class="bottom-row" id="actionRow" style="display:none;">
        <button class="lang-toggle" id="langBtn" onclick="toggleLang()">EN</button>
        <button class="send-btn" id="sendBtn" onclick="send()">送信</button>
    </div>
</div>

<script>
    /* ── Streamlit component protocol ── */
    function postToStreamlit(type, data) {
        window.parent.postMessage(
            Object.assign({isStreamlitMessage: true, type: type}, data), "*"
        );
    }
    const Streamlit = {
        setComponentReady: () => postToStreamlit("streamlit:componentReady", {apiVersion: 1}),
        setFrameHeight: (h) => postToStreamlit("streamlit:setFrameHeight", {height: h}),
        setComponentValue: (v) => postToStreamlit("streamlit:setComponentValue", {value: v})
    };

    /* ── Speech Recognition ── */
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isRecording = false;
    let finalText = "";
    let currentLang = "ja-JP";

    if (!SR) {
        document.getElementById("app").innerHTML =
            '<div class="unsupported">このブラウザは音声認識に対応していません。Chrome または Edge をお使いください。</div>';
    } else {
        initRecognition();
    }

    function initRecognition() {
        recognition = new SR();
        recognition.lang = currentLang;
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onresult = (e) => {
            let interim = "";
            finalText = "";
            for (let i = 0; i < e.results.length; i++) {
                if (e.results[i].isFinal) finalText += e.results[i][0].transcript;
                else interim += e.results[i][0].transcript;
            }
            const el = document.getElementById("transcript");
            el.textContent = finalText + interim;
            el.classList.remove("empty");
            updateHeight();
        };

        recognition.onend = () => {
            if (isRecording) {
                try { recognition.start(); } catch (e) {}
            } else {
                const text = finalText.trim();
                if (text) {
                    document.getElementById("status").textContent = "認識完了 — 送信してください";
                    document.getElementById("actionRow").style.display = "flex";
                } else {
                    document.getElementById("status").textContent = "マイクボタンを押して話してください";
                }
                document.getElementById("micBtn").classList.remove("active");
                updateHeight();
            }
        };

        recognition.onerror = (e) => {
            if (e.error === "no-speech" || e.error === "aborted") return;
            document.getElementById("status").textContent = "エラー: " + e.error;
            stopRecording();
        };
    }

    function toggle() {
        if (isRecording) stopRecording();
        else startRecording();
    }

    function startRecording() {
        if (!recognition) return;
        finalText = "";
        document.getElementById("transcript").textContent = "";
        document.getElementById("transcript").classList.add("empty");
        document.getElementById("actionRow").style.display = "none";
        try {
            recognition.start();
            isRecording = true;
            document.getElementById("micBtn").classList.add("active");
            document.getElementById("status").textContent = "聞いています...";
            updateHeight();
        } catch (e) { console.error(e); }
    }

    function stopRecording() {
        isRecording = false;
        if (recognition) try { recognition.stop(); } catch (e) {}
    }

    function send() {
        const text = document.getElementById("transcript").textContent.trim();
        if (text) {
            Streamlit.setComponentValue({text: text, ts: Date.now()});
            document.getElementById("transcript").textContent = "";
            document.getElementById("transcript").classList.add("empty");
            document.getElementById("actionRow").style.display = "none";
            document.getElementById("status").textContent = "送信しました";
            finalText = "";
            updateHeight();
        }
    }

    function toggleLang() {
        const wasRecording = isRecording;
        if (wasRecording) stopRecording();
        currentLang = currentLang === "ja-JP" ? "en-US" : "ja-JP";
        document.getElementById("langBtn").textContent = currentLang === "ja-JP" ? "EN" : "JP";
        initRecognition();
        document.getElementById("status").textContent =
            currentLang === "ja-JP" ? "日本語モード" : "English mode";
        updateHeight();
    }

    function updateHeight() {
        setTimeout(() => Streamlit.setFrameHeight(document.body.scrollHeight + 16), 50);
    }

    window.addEventListener("message", (e) => {
        if (e.data && e.data.type === "streamlit:render") updateHeight();
    });

    Streamlit.setComponentReady();
    updateHeight();
</script>
</body>
</html>
